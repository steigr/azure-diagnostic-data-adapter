# Azure Diagnostic Data Reader - Example Configuration

# Single source configuration (optional if 'sources' is provided)
source:
  # Azure Storage Account name (uses DefaultAzureCredential for auth)
  storage_account_name: "mystorageaccount"
  
  # Alternatively, use a connection string (not recommended for production)
  # connection_string: "DefaultEndpointsProtocol=https;AccountName=...;AccountKey=...;EndpointSuffix=core.windows.net"
  
  # Blob container name
  container_name: "diagnostics"
  
  # Regex pattern to match blob names (optional)
  file_pattern: ".*\\.json$"

# Multiple sources configuration (optional if 'source' is provided)
# Sources are aggregated by storage_account_name for API efficiency
# sources:
#   # First source - production logs
#   - storage_account_name: "prodstorageaccount"
#     container_name: "logs-production"
#     file_pattern: ".*\\.json$"
#
#   # Second source - same storage account, different container
#   # (will share the same Azure client connection)
#   - storage_account_name: "prodstorageaccount"
#     container_name: "logs-staging"
#     file_pattern: ".*\\.json$"
#
#   # Third source - different storage account
#   - storage_account_name: "devstorageaccount"
#     container_name: "logs-development"
#     file_pattern: ".*\\.log$"
#
#   # Source with connection string
#   - connection_string: "DefaultEndpointsProtocol=https;AccountName=...;AccountKey=..."
#     container_name: "archive"
#     file_pattern: ".*\\.json$"

output:
  # Directory for NDJSON output files (default: .)
  directory: "/var/log/adda"
  
  # Output filename (hash suffix will be added based on source) (default: output.ndjson)
  # e.g., diagnostics_abc12345.ndjson
  filename: "diagnostics.ndjson"
  
  # Max file size in MiB before rotation (default: 0 = disabled)
  max_size: 0

  # Max number of backup files to keep (default: 0 = keep all)
  max_backups: 0

  # Max age in days for backup files (default: 0 = keep forever)
  max_age: 0

  # Enable gzip compression for output (default: false)
  # When enabled, padding is not applied to first writes
  gzip: false

  # Delay before deleting output files (default: 1m, 0s = disabled)
  # After this delay, the output file will be automatically deleted
  delete_delay: 1m

parsers:
  # Built-in NDJSON parser (default for .json files)
  # NDJSON = Newline Delimited JSON, one JSON object per line
  - id: "ndjson"
    type: "ndjson"
    file_pattern: ".*\\.json$"
  
  # JSON array parser (for files containing JSON arrays or single objects)
  # - id: "json-array"
  #   type: "json"
  #   file_pattern: ".*\\.json-array$"

  # Example: Parser with named capture groups for date extraction
  # Named capture groups (e.g., (?P<year>\d{4})) are available in enrichment templates via .Metadata.FileMatch
  # - id: "logs-with-date"
  #   type: "ndjson"
  #   file_pattern: "logs/(?P<year>\\d{4})/(?P<month>\\d{2})/(?P<day>\\d{2})/.*\\.json$"

  # Example: Parser for log files
  # - id: "logs"
  #   type: "ndjson"
  #   file_pattern: "logs/.*\\.log$"
  
  # Example external parser for CSV files
  # - id: "csv"
  #   type: "external"
  #   file_pattern: ".*\\.csv$"
  #   command: "/usr/local/bin/csv-to-json"
  #   args: ["--format", "json"]
  #   env:
  #     PARSER_CONFIG: "/etc/csv-parser.conf"
  
  # Catch-all parser (no file_pattern means matches all files)
  # - id: "default"
  #   type: "ndjson"

# Go text/template for metadata enrichment
# Available variables: .Record, .Metadata.BlobName, .Metadata.ContainerName, 
#                      .Metadata.StorageAccount, .Metadata.ProcessedAt, .Metadata.Size,
#                      .Metadata.ContentType, .Metadata.LastModified
#
# Hierarchical path fields (automatically parsed from BlobName):
#   .Metadata.Directory  - Parent directory path (e.g., "logs/app/2026")
#   .Metadata.FileName   - Base filename (e.g., "data.json")
#   .Metadata.Extension  - File extension without dot (e.g., "json")
#   .Metadata.PathParts  - Array of path components (e.g., ["logs", "app", "2026", "data.json"])
#
# FileMatch fields (from parser file_pattern named capture groups):
#   .Metadata.FileMatch  - Map of capture group names to values
#   Example: With file_pattern "logs/(?P<year>\d{4})/(?P<month>\d{2})/.*\.json$"
#            and blob name "logs/2026/01/data.json"
#            .Metadata.FileMatch["year"] = "2026", .Metadata.FileMatch["month"] = "01"
#
# Accessing capture groups in templates:
#   {{ index .Metadata.FileMatch "year" }}   - Get capture group by name
#   {{ .Metadata.FileMatch.year }}           - Alternative dot notation (if key is valid identifier)
#
# Path helper functions:
#   pathDir <path>         - Get directory portion of path
#   pathBase <path>        - Get base filename
#   pathExt <path>         - Get extension without dot
#   pathSplit <path>       - Split path into array
#   pathPart <parts> <i>   - Get specific path component by index
#   pathJoin <parts>...    - Join path components
enrichment_template: |
  {
    "_source": {
      "blob": "{{ .Metadata.BlobName }}",
      "container": "{{ .Metadata.ContainerName }}",
      "storage_account": "{{ .Metadata.StorageAccount }}",
      "processed_at": "{{ .Metadata.ProcessedAt.Format "2006-01-02T15:04:05Z07:00" }}",
      "last_modified": "{{ .Metadata.LastModified.Format "2006-01-02T15:04:05Z07:00" }}",
      "size": {{ .Metadata.Size }},
      "directory": "{{ .Metadata.Directory }}",
      "filename": "{{ .Metadata.FileName }}",
      "extension": "{{ .Metadata.Extension }}"
    }
  }

# ============================================================================
# CAPTURE GROUP SCENARIO EXAMPLE
# ============================================================================
# This example demonstrates how to use named capture groups in file_pattern
# to extract metadata from blob paths and use them in enrichment templates.
#
# Scenario: Processing Azure diagnostic logs organized by environment, date, and service
# Blob path format: logs/<environment>/<year>/<month>/<day>/<service>/<filename>.json
# Example blob: logs/production/2026/01/15/api-gateway/requests.json
#
# Step 1: Define parser with named capture groups in file_pattern
# ----------------------------------------------------------------
# parsers:
#   - id: "azure-diagnostics"
#     type: "ndjson"
#     file_pattern: "logs/(?P<environment>[^/]+)/(?P<year>\\d{4})/(?P<month>\\d{2})/(?P<day>\\d{2})/(?P<service>[^/]+)/.*\\.json$"
#
# Step 2: Use capture groups in enrichment_template
# -------------------------------------------------
# enrichment_template: |
#   {
#     "_source": {
#       "blob": "{{ .Metadata.BlobName }}",
#       "container": "{{ .Metadata.ContainerName }}",
#       "storage_account": "{{ .Metadata.StorageAccount }}",
#       "processed_at": "{{ .Metadata.ProcessedAt.Format "2006-01-02T15:04:05Z07:00" }}"
#     },
#     "environment": "{{ index .Metadata.FileMatch "environment" }}",
#     "service": "{{ index .Metadata.FileMatch "service" }}",
#     "log_date": "{{ index .Metadata.FileMatch "year" }}-{{ index .Metadata.FileMatch "month" }}-{{ index .Metadata.FileMatch "day" }}"
#   }
#
# Result for blob "logs/production/2026/01/15/api-gateway/requests.json":
# ------------------------------------------------------------------------
# {
#   "_source": {
#     "blob": "logs/production/2026/01/15/api-gateway/requests.json",
#     "container": "diagnostics",
#     "storage_account": "mystorageaccount",
#     "processed_at": "2026-01-15T10:30:00Z"
#   },
#   "environment": "production",
#   "service": "api-gateway",
#   "log_date": "2026-01-15",
#   ... (original record fields)
# }
#
# For external parsers, capture groups are also available as environment variables:
# ---------------------------------------------------------------------------------
#   STORAGE_ACCOUNT_NAME=mystorageaccount
#   CONTAINER_NAME=diagnostics
#   BLOB_NAME=logs/production/2026/01/15/api-gateway/requests.json
#   MATCH_ENVIRONMENT=production
#   MATCH_YEAR=2026
#   MATCH_MONTH=01
#   MATCH_DAY=15
#   MATCH_SERVICE=api-gateway
#
# Example external parser using capture groups in environment:
# ------------------------------------------------------------
# parsers:
#   - id: "custom-parser"
#     type: "external"
#     file_pattern: "logs/(?P<environment>[^/]+)/(?P<service>[^/]+)/.*\\.log$"
#     command: "/usr/local/bin/log-parser.sh"
#     stdin: true
#     stdout: true
#     env:
#       # Use envsubst to reference capture groups
#       LOG_ENV: "${MATCH_ENVIRONMENT}"
#       LOG_SERVICE: "${MATCH_SERVICE}"
# ============================================================================

metrics:
  # Enable Prometheus metrics endpoint (default: true)
  enabled: true
  
  # Metrics server address (default: :9090)
  address: ":9090"

processing:
  # Number of parallel workers (default: 1)
  workers: 2
  
  # Dry run mode (don't modify anything) (default: false)
  dry_run: false
  
  # Delete blobs after successful processing (default: true)
  delete_after_process: true
  
  # Enable backoff based on free disk space (default: true)
  backoff_enabled: true
  
  # Minimum free space before backing off (default: 256MiB)
  # Examples: 1GB, 500MB, 100MiB
  min_free_space: "256MiB"

  # Retry attempts for failed operations (default: 3)
  retry_attempts: 3
  
  # Delay between retries (default: 5s)
  retry_delay: "5s"
  
  # Temporary directory for external parsers (default: system temp directory)
  # Each parsing operation creates a unique subdirectory
  temp_dir: "/tmp/adda"

  # Sort order for blob processing: "oldest" or "newest" (default: oldest)
  # - oldest: Process oldest blobs first (good for FIFO processing)
  # - newest: Process newest blobs first (good for prioritizing recent data)
  sort_order: "oldest"

  # Maximum blobs to process per batch in continuous mode (default: 0 = unlimited)
  batch_limit: 0

  # Maximum blobs to process in --once mode (default: 10)
  once_limit: 10

  # Minimum age of blobs to process (default: 0s = no minimum)
  # Useful to avoid processing files that are still being written
  # Examples: 15s, 5m, 1h, 24h
  min_age: "0s"

  # Maximum age of blobs to process (default: 0s = no maximum)
  # Useful to skip very old files that have already been processed
  # Examples: 24h, 168h (note: Go duration format, use "h" for hours)
  max_age: "0s"

  # Interval between polling for new blobs in continuous mode (default: 1m)
  # Lower values increase responsiveness but also API calls
  # Examples: 30s, 1m, 5m
  poll_interval: "1m"

logging:
  # Log level: debug, info, warn, error (default: info)
  level: "info"
  
  # Log format: text, json (default: text)
  format: "json"
